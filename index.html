<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoL Basmaca</title>
  <meta name="description" content="LoL'ün kadın şampiyonları ikişer ikişer. Basarım mı, basmam mı? Finale kadar seç.">
  <meta property="og:title" content="LoL Basmaca">
  <meta property="og:description" content="İkişer ikişer, finale kadar. Kimi basarsın?">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080c;
      --panel: rgba(255, 255, 255, 0.06);
      --line: rgba(255, 255, 255, 0.12);
      --text: #f4f1ea;
      --muted: rgba(244, 241, 234, 0.6);
      --gold: #f0c35a;
      --hot: #ff3d6e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
    }
    .screen.active { display: flex; }

    /* Başlangıç */
    #start {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      overflow: hidden;
    }
    #start .mosaic {
      position: absolute;
      inset: -10%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      transform: rotate(-8deg);
      opacity: 0.5;
      filter: saturate(1.1);
    }
    #start .mosaic div {
      aspect-ratio: 308 / 560;
      background-size: cover;
      background-position: center;
      border-radius: 10px;
    }
    #start::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(7, 8, 12, 0.55) 0%, rgba(7, 8, 12, 0.95) 70%);
    }
    #start .content { position: relative; z-index: 1; max-width: 640px; }
    .eyebrow {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      font-family: Unbounded, sans-serif;
      font-weight: 800;
      font-size: clamp(44px, 10vw, 112px);
      line-height: 0.95;
      margin: 24px 0 16px;
      letter-spacing: -0.03em;
    }
    h1 span {
      background: linear-gradient(90deg, var(--gold), var(--hot));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .lead { color: var(--muted); font-size: clamp(16px, 2vw, 19px); line-height: 1.5; margin: 0 0 32px; }
    .btn {
      border: 0;
      cursor: pointer;
      padding: 16px 34px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 17px;
      background: linear-gradient(90deg, var(--gold), var(--hot));
      color: #120a05;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.5; cursor: wait; transform: none; }
    .btn.ghost {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    /* Maç */
    #match { flex-direction: column; }
    .topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      pointer-events: none;
    }
    .pill {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(7, 8, 12, 0.55);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .pill.round { font-family: Unbounded, sans-serif; letter-spacing: 0.02em; }
    .progress {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      z-index: 6;
      background: rgba(255, 255, 255, 0.08);
    }
    .progress i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--gold), var(--hot));
      transition: width 0.4s ease;
    }
    .arena { flex: 1; display: flex; position: relative; }
    .card {
      position: relative;
      flex: 1;
      overflow: hidden;
      cursor: pointer;
      border: 0;
      padding: 0;
      background: #111;
      text-align: left;
      transition: flex 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s ease, filter 0.35s ease;
    }
    .card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
      transform: scale(1.02);
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease;
      opacity: 0;
    }
    .card img.loaded { opacity: 1; }
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7, 8, 12, 0) 45%, rgba(7, 8, 12, 0.92) 100%);
      pointer-events: none;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      border: 3px solid transparent;
      transition: border-color 0.2s ease;
      pointer-events: none;
    }
    @media (hover: hover) {
      .arena:not(.locked) .card:hover { flex: 1.25; }
      .arena:not(.locked) .card:hover img { transform: scale(1.07); }
      .arena:not(.locked) .card:hover::before { border-color: var(--gold); }
      .arena:not(.locked) .card:hover .cta { background: linear-gradient(90deg, var(--gold), var(--hot)); color: #120a05; border-color: transparent; }
    }
    .card .info {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 3;
      padding: 28px clamp(16px, 4vw, 40px);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }
    .card .name {
      font-family: Unbounded, sans-serif;
      font-weight: 800;
      font-size: clamp(24px, 4vw, 52px);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .card .title {
      margin-top: 8px;
      color: var(--muted);
      font-size: clamp(13px, 1.4vw, 16px);
      text-transform: capitalize;
    }
    .cta {
      flex-shrink: 0;
      padding: 12px 20px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(7, 8, 12, 0.5);
      backdrop-filter: blur(10px);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.06em;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .card.win::before { border-color: var(--gold); }
    .card.win { flex: 3; }
    .card.win .cta { background: linear-gradient(90deg, var(--gold), var(--hot)); color: #120a05; border-color: transparent; }
    .card.lose { flex: 0.6; filter: grayscale(1) brightness(0.4); }
    .card.lose .cta { opacity: 0; }
    .vs {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      width: 68px; height: 68px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: Unbounded, sans-serif;
      font-weight: 800;
      font-size: 18px;
      background: rgba(7, 8, 12, 0.7);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .arena.locked .vs { opacity: 0; }
    .hint {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      padding: 0 0 10px;
      font-size: 12px;
      color: var(--muted);
      pointer-events: none;
    }
    @media (max-width: 720px) {
      .arena { flex-direction: column; }
      .topbar { padding: 12px 16px; }
      .card .info { padding: 16px; }
      .cta { padding: 10px 14px; font-size: 12px; }
      .vs { width: 52px; height: 52px; font-size: 14px; }
      .hint { display: none; }
    }

    /* Şampiyon */
    #winner { align-items: flex-end; justify-content: center; }
    #winner .bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 25%;
      animation: zoom 12s ease-out forwards;
    }
    #winner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7, 8, 12, 0.1) 30%, rgba(7, 8, 12, 0.95) 100%);
    }
    @keyframes zoom { from { transform: scale(1.12); } to { transform: scale(1); } }
    #winner .content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      padding: 0 16px clamp(32px, 8vh, 80px);
      text-align: center;
      animation: rise 0.7s 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
    #winner h2 {
      font-family: Unbounded, sans-serif;
      font-weight: 800;
      font-size: clamp(48px, 11vw, 140px);
      line-height: 0.9;
      margin: 18px 0 10px;
      letter-spacing: -0.03em;
    }
    #winner .podium {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 20px 0 28px;
    }
    #winner .podium .pill { font-weight: 500; }
    #winner .podium .pill b { color: var(--gold); margin-right: 6px; }
    #winner .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    .error { color: var(--hot); margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <section id="start" class="screen active">
    <div class="mosaic" id="mosaic"></div>
    <div class="content">
      <span class="eyebrow" id="count">League of Legends</span>
      <h1>LoL<br><span>Basmaca</span></h1>
      <p class="lead">Kadın şampiyonlar ikişer ikişer karşına çıkacak. Basacağını seç, kazanan bir sonraki tura geçsin. Finalde tek bir şampiyon kalacak.</p>
      <button class="btn" id="startBtn" disabled>Yükleniyor…</button>
      <div class="error" id="error" hidden></div>
    </div>
  </section>

  <section id="match" class="screen">
    <div class="progress"><i id="bar"></i></div>
    <div class="topbar">
      <span class="pill round" id="roundName"></span>
      <span class="pill" id="matchNo"></span>
    </div>
    <div class="arena" id="arena">
      <button class="card" data-side="0" type="button">
        <img alt="">
        <div class="info"><div><div class="name"></div><div class="title"></div></div><span class="cta">BASARIM</span></div>
      </button>
      <button class="card" data-side="1" type="button">
        <img alt="">
        <div class="info"><div><div class="name"></div><div class="title"></div></div><span class="cta">BASARIM</span></div>
      </button>
      <div class="vs">VS</div>
      <div class="hint">← → tuşlarıyla da seçebilirsin</div>
    </div>
  </section>

  <section id="winner" class="screen">
    <div class="bg" id="winnerBg"></div>
    <div class="content">
      <span class="eyebrow">Şampiyon</span>
      <h2 id="winnerName"></h2>
      <div class="podium" id="podium"></div>
      <div class="actions">
        <button class="btn" id="againBtn" type="button">Tekrar oyna</button>
        <button class="btn ghost" id="shareBtn" type="button">Sonucu paylaş</button>
      </div>
    </div>
  </section>

  <script>
    const FEMALE = ['Ahri', 'Akali', 'Ambessa', 'Ashe', 'Aurora', 'Belveth', 'Caitlyn', 'Camille', 'Cassiopeia',
      'Diana', 'Elise', 'Evelynn', 'Fiora', 'Gwen', 'Illaoi', 'Irelia', 'Janna', 'Jinx', 'Kaisa', 'Kalista',
      'Karma', 'Katarina', 'Kayle', 'Leblanc', 'Leona', 'Lissandra', 'Lux', 'Mel', 'MissFortune', 'Morgana',
      'Nami', 'Neeko', 'Nidalee', 'Nilah', 'Qiyana', 'Quinn', 'Renata', 'Riven', 'Samira', 'Sejuani', 'Senna',
      'Seraphine', 'Shyvana', 'Sivir', 'Sona', 'Soraka', 'Syndra', 'Vayne', 'Vi', 'Xayah', 'Yunara', 'Zyra'];
    const DD = 'https://ddragon.leagueoflegends.com';
    const splash = id => `${DD}/cdn/img/champion/splash/${id}_0.jpg`;
    const loading = id => `${DD}/cdn/img/champion/loading/${id}_0.jpg`;
    const $ = id => document.getElementById(id);

    let champs = [];
    let current, next, pairIdx, roundNo, totalMatches, playedMatches, eliminated, locked;

    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    }

    function shuffle(a) {
      a = a.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function preload(list) {
      list.forEach(c => { const img = new Image(); img.src = splash(c.id); });
    }

    async function load() {
      try {
        const versions = await (await fetch(`${DD}/api/versions.json`)).json();
        const data = (await (await fetch(`${DD}/cdn/${versions[0]}/data/tr_TR/champion.json`)).json()).data;
        champs = FEMALE.filter(id => data[id]).map(id => ({ id, name: data[id].name, title: data[id].title }));
        $('count').textContent = `${champs.length} şampiyon · tek kazanan`;
        $('mosaic').innerHTML = shuffle(champs).slice(0, 32)
          .map(c => `<div style="background-image:url('${loading(c.id)}')"></div>`).join('');
        $('startBtn').disabled = false;
        $('startBtn').textContent = 'Başla';
      } catch (e) {
        $('startBtn').textContent = 'Yüklenemedi';
        $('error').hidden = false;
        $('error').textContent = 'Şampiyon verisi alınamadı, sayfayı yenile.';
      }
    }

    function roundLabel(n) {
      if (n === 2) return 'Final';
      if (n <= 4) return 'Yarı final';
      if (n <= 8) return 'Çeyrek final';
      return `Son ${n}`;
    }

    function start() {
      current = shuffle(champs);
      next = [];
      pairIdx = 0;
      roundNo = 1;
      eliminated = [];
      playedMatches = 0;
      totalMatches = champs.length - 1;
      show('match');
      showPair();
    }

    function showPair() {
      // Tek kalan varsa bay geçer
      if (pairIdx === current.length - 1) {
        next.push(current[pairIdx]);
        pairIdx += 2;
      }
      if (pairIdx >= current.length) {
        current = next;
        next = [];
        pairIdx = 0;
        roundNo++;
        if (current.length === 1) return finish(current[0]);
        current = shuffle(current);
      }

      const pair = [current[pairIdx], current[pairIdx + 1]];
      const matchesInRound = Math.floor(current.length / 2);
      $('roundName').textContent = roundLabel(current.length);
      $('matchNo').textContent = current.length === 2 ? 'Son maç' : `${pairIdx / 2 + 1} / ${matchesInRound}`;
      $('bar').style.width = `${(playedMatches / totalMatches) * 100}%`;

      const arena = $('arena');
      arena.classList.remove('locked');
      arena.querySelectorAll('.card').forEach((card, i) => {
        const c = pair[i];
        card.classList.remove('win', 'lose');
        const img = card.querySelector('img');
        img.classList.remove('loaded');
        img.onload = () => img.classList.add('loaded');
        img.src = splash(c.id);
        img.alt = c.name;
        if (img.complete) img.classList.add('loaded');
        card.querySelector('.name').textContent = c.name;
        card.querySelector('.title').textContent = c.title;
      });
      locked = false;
      preload(current.slice(pairIdx + 2, pairIdx + 4));
    }

    function pick(side) {
      if (locked) return;
      locked = true;
      const pair = [current[pairIdx], current[pairIdx + 1]];
      next.push(pair[side]);
      eliminated.push({ champ: pair[1 - side], left: current.length });
      playedMatches++;

      const arena = $('arena');
      arena.classList.add('locked');
      arena.querySelectorAll('.card').forEach((card, i) => card.classList.add(i === side ? 'win' : 'lose'));
      $('bar').style.width = `${(playedMatches / totalMatches) * 100}%`;

      setTimeout(() => {
        pairIdx += 2;
        showPair();
      }, 650);
    }

    function finish(champ) {
      $('winnerBg').style.backgroundImage = `url('${splash(champ.id)}')`;
      $('winnerName').textContent = champ.name;
      const finalist = eliminated.filter(e => e.left === 2).map(e => e.champ);
      const semis = eliminated.filter(e => e.left > 2 && e.left <= 4).map(e => e.champ);
      $('podium').innerHTML =
        finalist.map(c => `<span class="pill"><b>2.</b>${c.name}</span>`).join('') +
        semis.map(c => `<span class="pill"><b>3.</b>${c.name}</span>`).join('');
      show('winner');
      // Yeniden oynatınca animasyon baştan başlasın
      const bg = $('winnerBg');
      bg.style.animation = 'none';
      void bg.offsetWidth;
      bg.style.animation = '';
      window._winner = champ;
    }

    async function share() {
      const text = `LoL Basmaca'da şampiyonum: ${window._winner.name} 🔥`;
      const url = location.href;
      try {
        if (navigator.share) await navigator.share({ text, url });
        else {
          await navigator.clipboard.writeText(`${text} ${url}`);
          $('shareBtn').textContent = 'Kopyalandı!';
          setTimeout(() => $('shareBtn').textContent = 'Sonucu paylaş', 1500);
        }
      } catch (e) {}
    }

    $('startBtn').addEventListener('click', start);
    $('againBtn').addEventListener('click', start);
    $('shareBtn').addEventListener('click', share);
    $('arena').querySelectorAll('.card').forEach(card =>
      card.addEventListener('click', () => pick(Number(card.dataset.side))));
    document.addEventListener('keydown', e => {
      if (!$('match').classList.contains('active')) return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') pick(0);
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') pick(1);
    });

    load();
  </script>
</body>
</html>
